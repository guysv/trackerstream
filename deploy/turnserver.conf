# trackerstream STUN (coturn) — NAT traversal for the data plane.
#
# TURN IS DELIBERATELY NOT ENABLED, and this is a product decision, not an oversight. TURN RELAYS
# media, which means running an open relay for the internet and handing every web visitor a
# credential to use it — an unbounded bandwidth bill and an abuse vector. STUN merely tells a peer
# its own public address so two peers can connect DIRECTLY; it needs no credential and no relay.
#
# The cost is explicit: two browsers behind SYMMETRIC NATs cannot reach each other, and because
# bitswap refuses relayed (Limited) connections there is no fallback for that pair — they simply
# fetch from a seed instead. Every other NAT combination works over STUN.
#
# If you ever DO enable TURN, note what is missing today and would each fail silently:
#   - no min-port/max-port here, and install.sh never opens the relay range in ufw, so TURN
#     allocations would fail even with perfect credentials (plain STUN binding works, which is
#     why nobody has noticed);
#   - no denied-peer-ip, so a public relay would reach loopback, RFC1918, and 169.254.169.254
#     (cloud metadata);
#   - lt-cred-mech below is a single STATIC credential — publishing it to a web bundle is
#     equivalent to running an open relay. use-auth-secret + per-request HMAC creds is the
#     only sane shape.
#
# STUN (binding discovery) works out of the box; TURN provides the relay
# fallback for symmetric NATs. This is the classic-NAT path; libp2p peers also
# get a libp2p-native path via the master kubo node's Circuit Relay v2 + AutoNAT
# and client-side DCUtR hole punching. install.sh fills __TURN_SECRET__ and
# __PUBLIC_IP__.
listening-port=3478
tls-listening-port=5349
fingerprint
realm=trackerstream

# Public address of the droplet (DigitalOcean: public IP is directly assigned).
external-ip=__PUBLIC_IP__

# TURN long-term credential (relay fallback). Secret injected at install time.
lt-cred-mech
user=trackerstream:__TURN_SECRET__

# Hardening.
no-cli
no-multicast-peers
syslog
