# trackerstream desktop release
#
# Tag-triggered, UNSIGNED cross-platform build. Tauri cannot cross-compile bundles,
# so each OS builds on its own runner. Structure (tauri-action's recommended
# multi-platform pattern):
#
#   create-release  — makes ONE draft GitHub Release for the tag, outputs its id.
#   build (matrix)  — each leg builds its bundle and uploads to that release by id.
#
# Passing `releaseId` (instead of tagName/releaseDraft) means every leg uploads to a
# single, already-existing release: no per-leg "find-or-create" race (which previously
# left the draft getting clobbered/deleted across the matrix).
#
# macOS is ad-hoc codesigned (APPLE_SIGNING_IDENTITY=-) so the app + tsnode sidecar
# launch on Apple Silicon — Gatekeeper still shows the "unidentified developer" prompt
# (that only clears with a real Developer ID cert + notarization; see docs/RELEASE.md).
# Windows still SmartScreen-warns; Linux is clean.
#
# The Go `tsnode` sidecar is cross-built per leg by prepare-sidecar.sh, driven by the
# TS_TARGET_TRIPLE env var (Go cross-compiles with CGO_ENABLED=0). The libopenmpt WASM
# is committed (packages/wasm/dist), so no emscripten toolchain is needed here.
#
# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
name: release

on:
  push:
    tags: ["v*"]

# Never let two runs of the same tag race on the shared draft Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # create the Release + upload assets

jobs:
  # One draft Release per tag, created once so the matrix never races on it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create (or reuse) the draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Reuse an existing draft for this tag if a prior run left one, else create.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            let rel = releases.find(r => r.tag_name === tag && r.draft);
            if (!rel) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag, name: `trackerstream ${tag}`,
                draft: true, prerelease: true,
              });
              rel = data;
            }
            core.info(`draft release id=${rel.id} for ${tag}`);
            return rel.id;

  build:
    needs: create-release
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64,   os: macos-latest,     triple: aarch64-apple-darwin,      bundles: dmg }
          - { name: mac-x64,     os: macos-latest,     triple: x86_64-apple-darwin,       bundles: dmg }
          - { name: win-x64,     os: windows-latest,   triple: x86_64-pc-windows-msvc,    bundles: nsis }
          - { name: win-arm64,   os: windows-11-arm,   triple: aarch64-pc-windows-msvc,   bundles: nsis }
          - { name: linux-x64,   os: ubuntu-latest,    triple: x86_64-unknown-linux-gnu,  bundles: "deb,appimage" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, triple: aarch64-unknown-linux-gnu, bundles: "deb,appimage" }
    runs-on: ${{ matrix.os }}
    env:
      # Drives apps/desktop/src-tauri/scripts/prepare-sidecar.sh: builds the tsnode
      # sidecar for THIS leg's triple (both the explicit step and the prebuild hook).
      TS_TARGET_TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri v2 webkit/gtk stack (both the x64 and arm64 ubuntu legs). xdg-utils
      # provides /usr/bin/xdg-mime, which the AppImage bundler needs — the minimal
      # ubuntu-24.04-arm image lacks it (ubuntu-latest ships it), so omitting it
      # breaks the linux-arm64 AppImage while the .deb still succeeds.
      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf file build-essential curl wget libssl-dev xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"   # matches node/go.mod (go 1.25.7)

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Adds the non-native target where the runner arch differs (e.g. x86_64 on
          # the arm64 mac runner); a no-op where the triple is already native.
          targets: ${{ matrix.triple }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cross-build the tsnode sidecar for this leg's triple. The tauri prebuild hook
      # also runs this via TS_TARGET_TRIPLE, but doing it explicitly gives clear logs
      # and fails fast if the Go build breaks before the (slower) Rust bundle.
      - name: Build tsnode sidecar
        run: bash apps/desktop/src-tauri/scripts/prepare-sidecar.sh

      - name: Build + upload bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign the .app + nested externalBin sidecar on macOS only. Env-driven
          # (not tauri.conf.json) so a real "Developer ID Application: …" value can be
          # swapped in later — the docs/RELEASE.md notarization path — with no code change.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
        with:
          projectPath: apps/desktop
          # Upload to the single draft created above — no per-leg find-or-create race.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # --bundles overrides tauri.conf.json's `targets: "all"` at build time:
          # Windows → NSIS only (no .msi), macOS → dmg only (.app lives inside it).
          args: --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}
